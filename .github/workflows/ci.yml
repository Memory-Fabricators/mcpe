name: CI

on:
    pull_request:
        branches: [main]
    merge_group:
        branches: [main]
jobs:
    build:
        strategy:
            matrix:
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Setup Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: master

            - name: Verify Code Formatting
              run: zig fmt --check .

            - name: Run Tests
              run: zig build test
